# ===================================================================
#  nginx — galeries man.artt
# -------------------------------------------------------------------
#  Deposer dans /etc/nginx/sites-available/manartt, puis :
#
#     sudo ln -s /etc/nginx/sites-available/manartt /etc/nginx/sites-enabled/
#     sudo rm -f /etc/nginx/sites-enabled/default
#     sudo nginx -t && sudo systemctl reload nginx
#
#  Poser CE fichier AVANT de lancer certbot : certbot lit le
#  `server_name`, ajoute lui-meme le bloc HTTPS et la redirection.
# ===================================================================

server {
    listen 80;
    listen [::]:80;

    # A remplacer par le vrai domaine.
    server_name galeries.manartt.fr;

    root /var/www/manartt/dist;
    index index.html;

    # Une photo pese jusqu'a 80 Mo. La limite par defaut de nginx est de
    # 1 Mo : sans cette ligne, CHAQUE import echoue en 413, et le message
    # d'erreur ne dit pas pourquoi.
    client_max_body_size 100M;

    # Les galeries sont privees : elles n'ont rien a faire dans un moteur
    # de recherche, ni dans un cadre sur un autre site.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # ---------------------------------------------------------------
    #  Le site
    # ---------------------------------------------------------------
    location / {
        # Application a page unique : le serveur ne connait que
        # index.html, c'est le navigateur qui interprete /g/CODE.
        # SANS CETTE LIGNE, TOUS LES LIENS DE GALERIE RENVOIENT UNE 404 —
        # c'est-a-dire exactement ce que vos clientes recoivent par mail.
        try_files $uri $uri/ /index.html;
    }

    # Les fichiers d'assets portent une empreinte dans leur nom
    # (index-BDG8aV0-.js) : leur contenu ne change jamais.
    #
    # `expires` et non `add_header Cache-Control` : en nginx, un
    # `add_header` pose dans un `location` ANNULE tous ceux herites du
    # bloc parent. Les en-tetes de securite ci-dessus disparaitraient.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # index.html, lui, ne doit jamais etre garde : c'est lui qui designe
    # la version des assets. Un index.html perime pointerait vers des
    # fichiers effaces au deploiement suivant — page blanche.
    location = /index.html {
        expires -1;
    }

    # ---------------------------------------------------------------
    #  L'API
    # ---------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Sans cet en-tete, l'API voit tous les visiteurs sous la meme
        # adresse (127.0.0.1) et son frein anti-force brute devient
        # collectif : une cliente qui se trompe vingt fois de code
        # bloquerait toutes les autres. Voir `trustProxy` dans
        # server/src/index.ts, qui n'ecoute cet en-tete que du proxy local.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Une archive zip de plusieurs gigaoctets se diffuse pendant
        # plusieurs minutes. Le delai par defaut (60 s) la couperait en
        # plein telechargement, sans message.
        proxy_read_timeout  30m;
        proxy_send_timeout  30m;

        # Ni l'archive qui descend, ni les photos qui montent ne passent
        # par un fichier tampon : tout circule au fil de l'eau. Sans ca,
        # nginx ecrit une copie complete sur le disque a chaque transfert.
        proxy_buffering         off;
        proxy_request_buffering off;
    }
}
